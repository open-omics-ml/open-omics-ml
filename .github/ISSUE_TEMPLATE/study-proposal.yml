name: Study Proposal
description: Propose a paper for reanalysis (external contributors and new cohort members)
title: "Proposal: [FIRST AUTHOR] [YEAR] — [BRIEF TITLE]"
labels: ["study-proposal"]
body:

  - type: markdown
    attributes:
      value: |
        Use this form to propose a paper for reanalysis. A maintainer will review your proposal
        and confirm whether the paper is available and not already in progress.

  - type: input
    id: citation
    attributes:
      label: Full citation
      description: DOI
    validations:
      required: true

  - type: input
    id: data_link
    attributes:
      label: Raw data availability
      description: Link to publicly available dataset (GEO accession, Zenodo DOI, etc.) for raw reads
    validations:
      required: true

  - type: input
id: processed_data
attributes:
  label: Processed data availability
  description: Are the process data available? E.g. methylation calls, gene expression counts
validations:
  required: true


  - type: dropdown
    id: omics_type
    attributes:
      label: Omics type
      options:
        - Transcriptomics (bulk RNA-seq)
        - Transcriptomics (microarray)
        - Single-cell RNA-seq
        - DNA methylation (array)
        - DNA methylation (WGBS/RRBS)
        - Genomics / SNP / WGS
        - Proteomics
        - Metabolomics
        - ATAC-seq / chromatin accessibility
        - Multi-omics
        - Other
    validations:
      required: true

  - type: textarea
    id: rationale
    attributes:
      label: Rationale
      description: Why did you select this paper? Which pitfalls do you expect to find and why?
    validations:
      required: true

  - type: input
    id: contributorname
    attributes:
      label: Your name
    validations:
      required: true

    - type: input
  id: contributorinstitution
  attributes:
    label: Institution
  validations:
    required: true

  - type: dropdown
    id: code_available
    attributes:
      label: Is code available for the original analysis?
      options:
        - "Yes"
        - "Partial"
        - "No"
    validations:
      required: true

  - type: textarea
    id: notes
    attributes:
      label: Additional notes
      description: Anything else relevant — data size, computational requirements, known challenges

name: Validate Report

on:
  issues:
    types: [opened, edited]

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run validator
        id: validate
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: python scripts/validate_report.py

      - name: Post comment
        if: steps.validate.outputs.is_report == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: fs.readFileSync('validation_result.md', 'utf8')
            });

      - name: Apply label
        if: steps.validate.outputs.is_report == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const label = '${{ steps.validate.outputs.passed }}' === 'true'
              ? 'awaiting-supervisor-review' : 'needs-revision';
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              labels: [label]
            });

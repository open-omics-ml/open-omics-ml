name: Validate Audit Report (reusable)

on:
  workflow_call:
    inputs:
      issue_number:
        required: true
        type: number
      issue_body:
        required: true
        type: string

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      issues: write

    steps:
      - name: Check out central repo
        uses: actions/checkout@v4
        with:
          repository: open-omics-ml/open-omics-ml
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run validator
        id: validate
        env:
          ISSUE_BODY: ${{ inputs.issue_body }}
        run: python scripts/validate_audit_report.py

      - name: Post comment
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('validation_result.md', 'utf8');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: ${{ inputs.issue_number }},
              body
            });

      - name: Apply label
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const passed = fs.readFileSync(process.env.GITHUB_OUTPUT, 'utf8').includes('passed=true');
            const label = passed ? 'awaiting-supervisor-review' : 'needs-revision';
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: ${{ inputs.issue_number }},
              labels: [label]
            });

        - Unclear
        - Not applicable
    validations:
      required: true

  - type: dropdown
    id: p2_severity
    attributes:
      label: Severity (if present)
      options:
        - High
        - Medium
        - Low
        - N/A

  - type: textarea
    id: p2_evidence
    attributes:

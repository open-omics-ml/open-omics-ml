  # ─────────────────────────────────────────
  # SECTION 4: REANALYSIS (PART II)
  # ─────────────────────────────────────────

  - type: markdown
    attributes:
      value: "## Section 4: Reanalysis (Part II)"

  - type: dropdown
    id: part2_triggered
    attributes:
      label: Is Part II triggered?
      options:
        - "Yes"
        - "No — no medium/high severity pitfalls found"
        - "No — original results not reproduced (cause unresolved)"
        - "No — data or resource constraints (explain in notes)"
    validations:
      required: true

  - type: textarea
    id: part2_pitfalls_addressed
    attributes:
      label: Pitfalls addressed in reanalysis
      description: List which pitfalls you fixed and which you did not, with justification for each decision

  - type: textarea
    id: part2_fixes_applied
    attributes:
      label: Fixes applied
      description: Describe exactly what you changed and why

  - type: textarea
    id: part2_metrics
    attributes:
      label: Reanalysis metrics vs original
      description: |
        Format as a table:
        | Metric | Original reported | Part I reproduced | Part II reanalysis |
        |--------|------------------|------------------|-------------------|
        | AUC    | 0.92             | 0.89             | 0.81              |

  - type: dropdown
    id: part2_conclusion_verdict
    attributes:
      label: Does the main conclusion hold after reanalysis?
      options:
        - "Yes — conclusion robust to methodological improvements"
        - "Partially — effect reduced but direction maintained"
        - "No — conclusion does not hold"
        - "N/A — Part II not conducted"

  - type: textarea
    id: part2_interpretation
    attributes:
      label: Interpretation
      description: What do the reanalysis results mean for the biological question? Is the finding robust, qualified, or revised?

  # ─────────────────────────────────────────
  # SECTION 5: SUMMARY
  # ─────────────────────────────────────────

  - type: markdown
    attributes:
      value: "## Section 5: Summary (for meta-analysis)"

  - type: textarea
    id: summary_paragraph
    attributes:
      label: Summary paragraph
      description: One paragraph suitable for inclusion in the meta-analysis paper. Describe the study, what was found in the audit, and what the reanalysis showed (if conducted). Use factual, constructive language.
    validations:
      required: true

  - type: checkboxes
    id: pitfalls_present_summary
    attributes:
      label: Pitfalls present (tick all that apply)
      options:
        - label: P1 — No held-out test set
        - label: P2 — Preprocessing leakage
        - label: P3 — Feature selection leakage
        - label: P4 — Non-independence of samples
        - label: P5 — Confounding variables
        - label: P6 — Class imbalance mishandling
        - label: P7 — Distributional shift
        - label: P8 — Inappropriate performance metrics
        - label: P9 — High dimensionality overfitting
        - label: No pitfalls found

  - type: dropdown
    id: max_severity
    attributes:
      label: Highest severity pitfall found
      options:
        - High
        - Medium
        - Low
        - None
    validations:
      required: true

  - type: dropdown
    id: overall_conclusion_change
    attributes:
      label: Overall conclusion change
      options:
        - "Conclusion robust — holds after reanalysis"
        - "Conclusion qualified — holds with reduced effect size"
        - "Conclusion revised — does not hold after reanalysis"
        - "Cannot determine — Part II not conducted"
        - "Cannot determine — reproduction failed"
    validations:
      required: true

  - type: textarea
    id: notes
    attributes:
      label: Additional notes
      description: Anything else relevant that does not fit above

name: Audit Report
description: Open Omics ML reanalysis audit report — complete one per study
title: "Audit Report: [AUTHOR] [YEAR] — [BRIEF TITLE]"
labels: ["audit-report"]
body:

  - type: markdown
    attributes:
      value: |
        ## Open Omics ML Audit Report
        Complete every section. If a section is not applicable, state this explicitly and explain why.
        Refer to the [pitfall reference document](../../docs/pitfall-reference.md) and [student guide](../../docs/student-guide.md) before filling this in.

  # ─────────────────────────────────────────
  # SECTION 1: PAPER SUMMARY
  # ─────────────────────────────────────────

  - type: markdown
    attributes:
      value: "## Section 1: Paper summary"

  - type: input
    id: citation
    attributes:
      label: Full citation
      description: Author(s), year, title, journal, DOI
    validations:
      required: true

  - type: input
    id: data_source
    attributes:
      label: Data source
      description: Where data was accessed (GEO accession, URL, etc.) and date accessed
    validations:
      required: true

  - type: dropdown
    id: omics_type
    attributes:
      label: Omics type
      options:
        - Transcriptomics (bulk RNA-seq)
        - Transcriptomics (microarray)
        - Single-cell RNA-seq
        - DNA methylation (array)
        - DNA methylation (WGBS/RRBS)
        - Genomics / SNP / WGS
        - Proteomics
        - Metabolomics
        - ATAC-seq / chromatin accessibility
        - Multi-omics
        - Other (specify in notes)
    validations:
      required: true

  - type: dropdown
    id: ml_task
    attributes:
      label: ML task
      options:
        - Binary classification
        - Multi-class classification
        - Regression
        - Survival analysis
        - Clustering / unsupervised
        - Other (specify in notes)
    validations:
      required: true

  - type: input
    id: sample_size
    attributes:
      label: Sample size
      description: Total N, and class breakdown if classification
    validations:
      required: true

  - type: input
    id: n_features
    attributes:
      label: Number of features
      description: e.g. number of genes, CpGs, proteins used as input to the model
    validations:
      required: true

  - type: textarea
    id: main_claim
    attributes:
      label: Main claim
      description: In one or two sentences, what does the paper claim? What is the key reported result (metric and value)?
    validations:
      required: true

  - type: dropdown
    id: code_available
    attributes:
      label: Code available?
      options:
        - "Yes — used"
        - "Yes — not used (explain in notes)"
        - "Partial"
        - "No"
    validations:
      required: true

  # ─────────────────────────────────────────
  # SECTION 2: REPRODUCTION ATTEMPT
  # ─────────────────────────────────────────

  - type: markdown
    attributes:
      value: "## Section 2: Reproduction attempt"

  - type: input
    id: language_tools
    attributes:
      label: Language and key tools used
      description: e.g. Python 3.11, scikit-learn 1.4.0, R 4.3.2, etc.
    validations:
      required: true

  - type: textarea
    id: deviations
    attributes:
      label: Deviations from original methods
      description: List every deviation, whether forced or chosen. State the reason.
    validations:
      required: true

  - type: textarea
    id: reproduction_metrics
    attributes:
      label: Reported vs reproduced metrics
      description: |
        Format as a table:
        | Metric | Reported value | Reproduced value | Difference |
        |--------|---------------|-----------------|------------|
        | AUC    | 0.92          | 0.89            | -0.03      |
    validations:
      required: true

  - type: dropdown
    id: reproduction_verdict
    attributes:
      label: Reproduction verdict
      options:
        - Reproduced (within 5%, conclusion holds)
        - Partially reproduced (direction consistent, >5% difference)
        - Not reproduced (substantial difference or conclusion does not hold)
    validations:
      required: true

  - type: textarea
    id: reproduction_diagnosis
    attributes:
      label: Diagnosis (if not fully reproduced)
      description: What do you believe caused the difference? Ambiguous methods, missing data, software versions, possible error?

  # ─────────────────────────────────────────
  # SECTION 3: PITFALL AUDIT
  # ─────────────────────────────────────────

  - type: markdown
    attributes:
      value: |
        ## Section 3: Pitfall audit
        For each pitfall, select a verdict and provide evidence. Cite specific text from the methods section, supplementary materials, or code. Do not leave evidence fields blank.

  - type: markdown
    attributes:
      value: "### Pitfall 1: No held-out test set"

  - type: dropdown
    id: p1_verdict
    attributes:
      label: Verdict
      options:
        - Present
        - Absent
        - Unclear
        - Not applicable
    validations:
      required: true

  - type: dropdown
    id: p1_severity
    attributes:
      label: Severity (if present)
      options:
        - High
        - Medium
        - Low
        - N/A

  - type: textarea
    id: p1_evidence
    attributes:
      label: Evidence
      description: Quote or cite specific evidence for your verdict
    validations:
      required: true

  - type: dropdown
    id: p1_affects_conclusion
    attributes:
      label: Plausibly affects main conclusion?
      options:
        - "Yes"
        - "Possibly"
        - "No"
        - "Cannot determine"

  - type: markdown
    attributes:
      value: "### Pitfall 2: Preprocessing leakage"

  - type: dropdown
    id: p2_verdict
    attributes:
